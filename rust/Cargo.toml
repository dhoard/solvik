[package]
name = "solvik-rs"
version = "0.1.0"
edition = "2021"
description = "Rust Solvik compatibility runtime"
license = "Apache-2.0"

[[bin]]
name = "solvik"
path = "src/main.rs"

[dependencies]
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
